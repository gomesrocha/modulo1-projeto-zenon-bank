version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: zenon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zenon_fraud
      MYSQL_USER: zenon
      MYSQL_PASSWORD: zenon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro

volumes:
  mysql_data: